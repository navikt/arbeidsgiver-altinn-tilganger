name: Deploy dev manual
on:
  workflow_dispatch:

jobs:
  dev-deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        id: login
        with:
          team: fager

      - uses: nais/deploy/actions/deploy@1064e26587ab2794266a35f477387e561899a7ef # v2
        name: Deploy dev-gcp
        env:
          VAR: image=${{ steps.login.outputs.registry }}/arbeidsgiver-altinn-tilganger:${{ github.sha }}
          RESOURCE: nais/dev-gcp-altinn-tilganger.yaml
          CLUSTER: dev-gcp

