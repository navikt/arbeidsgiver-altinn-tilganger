name: Deploy dev manual
on:
  workflow_dispatch:

jobs:
  dev-deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        id: login
        with:
          team: fager

      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        name: Deploy dev-gcp
        env:
          VAR: image=${{ steps.login.outputs.registry }}/arbeidsgiver-altinn-tilganger:${{ github.sha }}
          RESOURCE: nais/dev-gcp-altinn-tilganger.yaml
          CLUSTER: dev-gcp

